<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c7566"/>
    </marker>
  </defs>

  <rect width="1000" height="720" fill="#1c2a21"/>

  <text x="40" y="46" fill="#f1ead9" font-size="24" font-weight="700">Kinloop — architecture</text>
  <text x="40" y="70" fill="#b9c4b8" font-size="13">Strands Agents SDK · Agents-as-Tools pattern · AWS Lambda + EventBridge (always-on) · optional AgentCore demo path</text>

  <!-- Trigger -->
  <rect x="40" y="110" width="200" height="70" rx="12" fill="#2e4136" stroke="#3c5245"/>
  <text x="140" y="140" fill="#f1ead9" font-size="14" text-anchor="middle" font-weight="600">EventBridge Scheduler</text>
  <text x="140" y="160" fill="#b9c4b8" font-size="11.5" text-anchor="middle">daily cron trigger</text>

  <!-- Lambda outer box -->
  <rect x="320" y="100" width="640" height="330" rx="14" fill="#25352b" stroke="#3c5245" stroke-width="1.5"/>
  <text x="345" y="128" fill="#e3a857" font-size="13" font-weight="700">AWS LAMBDA — kinloop-daily-run</text>
  <text x="345" y="146" fill="#b9c4b8" font-size="11">runs seconds/day · Strands Agents runtime</text>

  <!-- Supervisor -->
  <rect x="345" y="165" width="590" height="60" rx="10" fill="#2e4136" stroke="#8bbb9e"/>
  <text x="640" y="190" fill="#f1ead9" font-size="14" text-anchor="middle" font-weight="700">Supervisor Agent</text>
  <text x="640" y="208" fill="#b9c4b8" font-size="11" text-anchor="middle">orchestrates specialists · enforces cost-ceiling hook</text>

  <!-- 4 specialist agents -->
  <g>
    <rect x="345" y="245" width="135" height="80" rx="10" fill="#1c2a21" stroke="#3c5245"/>
    <text x="412" y="275" fill="#f1ead9" font-size="12.5" text-anchor="middle" font-weight="600">MedAgent</text>
    <text x="412" y="293" fill="#8bbb9e" font-size="10.5" text-anchor="middle">refill tracking</text>
    <text x="412" y="308" fill="#8bbb9e" font-size="10.5" text-anchor="middle">+ draft request</text>

    <rect x="497" y="245" width="135" height="80" rx="10" fill="#1c2a21" stroke="#3c5245"/>
    <text x="564" y="275" fill="#f1ead9" font-size="12.5" text-anchor="middle" font-weight="600">ApptAgent</text>
    <text x="564" y="293" fill="#8bbb9e" font-size="10.5" text-anchor="middle">conflict detection</text>
    <text x="564" y="308" fill="#8bbb9e" font-size="10.5" text-anchor="middle">+ propose fix</text>

    <rect x="649" y="245" width="135" height="80" rx="10" fill="#1c2a21" stroke="#3c5245"/>
    <text x="716" y="275" fill="#f1ead9" font-size="12.5" text-anchor="middle" font-weight="600">PaperworkAgent</text>
    <text x="716" y="293" fill="#8bbb9e" font-size="10.5" text-anchor="middle">deadline tracking</text>
    <text x="716" y="308" fill="#8bbb9e" font-size="10.5" text-anchor="middle">+ field extraction</text>

    <rect x="801" y="245" width="134" height="80" rx="10" fill="#1c2a21" stroke="#e3a857"/>
    <text x="868" y="275" fill="#f1ead9" font-size="12.5" text-anchor="middle" font-weight="600">NotifierAgent</text>
    <text x="868" y="293" fill="#e3a857" font-size="10.5" text-anchor="middle">escalation</text>
    <text x="868" y="308" fill="#e3a857" font-size="10.5" text-anchor="middle">gatekeeper</text>
  </g>

  <!-- lines supervisor to agents -->
  <line x1="412" y1="225" x2="412" y2="245" stroke="#5c7566" marker-end="url(#arrow)"/>
  <line x1="564" y1="225" x2="564" y2="245" stroke="#5c7566" marker-end="url(#arrow)"/>
  <line x1="716" y1="225" x2="716" y2="245" stroke="#5c7566" marker-end="url(#arrow)"/>
  <line x1="868" y1="225" x2="868" y2="245" stroke="#e3a857" marker-end="url(#arrow)"/>

  <!-- Bedrock -->
  <rect x="345" y="350" width="590" height="60" rx="10" fill="#2e4136" stroke="#3c5245"/>
  <text x="640" y="375" fill="#f1ead9" font-size="13" text-anchor="middle" font-weight="600">Amazon Bedrock — Amazon Nova Lite (on-demand)</text>
  <text x="640" y="393" fill="#b9c4b8" font-size="10.5" text-anchor="middle">every agent's reasoning calls; no provisioned throughput</text>
  <line x1="640" y1="325" x2="640" y2="350" stroke="#5c7566" marker-end="url(#arrow)"/>

  <line x1="240" y1="145" x2="320" y2="145" stroke="#5c7566" marker-end="url(#arrow)"/>

  <!-- storage row -->
  <rect x="40" y="470" width="200" height="70" rx="12" fill="#2e4136" stroke="#3c5245"/>
  <text x="140" y="500" fill="#f1ead9" font-size="13" text-anchor="middle" font-weight="600">DynamoDB</text>
  <text x="140" y="518" fill="#b9c4b8" font-size="11" text-anchor="middle">meds / appts / deadlines / log</text>

  <rect x="270" y="470" width="200" height="70" rx="12" fill="#2e4136" stroke="#3c5245"/>
  <text x="370" y="500" fill="#f1ead9" font-size="13" text-anchor="middle" font-weight="600">S3</text>
  <text x="370" y="518" fill="#b9c4b8" font-size="11" text-anchor="middle">uploaded documents</text>

  <rect x="500" y="470" width="230" height="70" rx="12" fill="#2e4136" stroke="#e3a857"/>
  <text x="615" y="500" fill="#f1ead9" font-size="13" text-anchor="middle" font-weight="600">SES / Slack webhook</text>
  <text x="615" y="518" fill="#e3a857" font-size="11" text-anchor="middle">only for real decisions</text>

  <rect x="750" y="470" width="225" height="70" rx="12" fill="#2e4136" stroke="#3c5245"/>
  <text x="862" y="500" fill="#f1ead9" font-size="13" text-anchor="middle" font-weight="600">CloudWatch Budget Alarm</text>
  <text x="862" y="518" fill="#b9c4b8" font-size="11" text-anchor="middle">50/80/100% email alerts</text>

  <line x1="412" y1="430" x2="140" y2="470" stroke="#5c7566" marker-end="url(#arrow)"/>
  <line x1="716" y1="430" x2="370" y2="470" stroke="#5c7566" marker-end="url(#arrow)"/>
  <line x1="868" y1="430" x2="615" y2="470" stroke="#e3a857" marker-end="url(#arrow)"/>

  <!-- Dashboard -->
  <rect x="270" y="600" width="460" height="80" rx="12" fill="#25352b" stroke="#8bbb9e"/>
  <text x="500" y="633" fill="#f1ead9" font-size="14" text-anchor="middle" font-weight="700">Dashboard (static HTML)</text>
  <text x="500" y="653" fill="#8bbb9e" font-size="11" text-anchor="middle">read-only view of today's activity log + pending decisions</text>
  <line x1="140" y1="540" x2="480" y2="600" stroke="#5c7566" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <text x="40" y="600" fill="#b9c4b8" font-size="11">Optional (demo-only, torn down after capture):</text>
  <rect x="40" y="612" width="200" height="46" rx="10" fill="#1c2a21" stroke="#c17862" stroke-dasharray="4,3"/>
  <text x="140" y="640" fill="#c17862" font-size="11" text-anchor="middle">Bedrock AgentCore Runtime</text>
</svg>
