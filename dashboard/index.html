<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kinloop — today's loop</title>
<style>
  :root{
    --ink:#1c2a21;
    --surface:#25352b;
    --surface-2:#2e4136;
    --hair:#3c5245;
    --text:#f1ead9;
    --text-dim:#b9c4b8;
    --amber:#e3a857;
    --sage:#8bbb9e;
    --rust:#c17862;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    line-height:1.5;
  }
  .wrap{max-width:920px;margin:0 auto;padding:40px 24px 80px;}

  header{display:flex;align-items:center;gap:16px;margin-bottom:8px;}
  .mark{width:40px;height:40px;flex:0 0 auto;}
  h1{
    font-family:Iowan Old Style,Palatino,"Palatino Linotype",Georgia,serif;
    font-weight:600;
    font-size:28px;
    letter-spacing:0.01em;
    margin:0;
  }
  .tagline{color:var(--text-dim);font-size:14px;margin:2px 0 0;}

  .strip{
    display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
    margin:32px 0;
  }
  .stat{
    background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);
    padding:18px 20px;
  }
  .stat .n{font-family:Iowan Old Style,Palatino,Georgia,serif;font-size:32px;line-height:1;}
  .stat .l{color:var(--text-dim);font-size:12.5px;text-transform:uppercase;letter-spacing:0.08em;margin-top:6px;}
  .stat.amber .n{color:var(--amber);}
  .stat.sage .n{color:var(--sage);}

  .decision-banner{
    background:linear-gradient(135deg, rgba(227,168,87,0.16), rgba(227,168,87,0.05));
    border:1px solid rgba(227,168,87,0.45);
    border-radius:var(--radius);
    padding:20px 22px;margin-bottom:36px;
  }
  .decision-banner h2{
    margin:0 0 4px;font-size:15px;text-transform:uppercase;letter-spacing:0.08em;color:var(--amber);
    font-family:inherit;font-weight:700;
  }
  .decision-item{
    display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
    padding:14px 0;border-top:1px solid rgba(227,168,87,0.25);
  }
  .decision-item:first-of-type{border-top:none;padding-top:10px;}
  .decision-item .msg{font-size:15px;}
  .decision-item .who{color:var(--text-dim);font-size:12.5px;margin-top:3px;}
  .btn{
    flex:0 0 auto;background:var(--amber);color:#22190a;border:none;border-radius:999px;
    padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;
  }
  .empty-decisions{color:var(--sage);font-size:15px;}

  h3.section-title{
    font-family:Iowan Old Style,Palatino,Georgia,serif;font-weight:600;font-size:19px;
    margin:36px 0 14px;
  }
  .panels{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .panel{background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);padding:16px 18px;}
  .panel h4{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-dim);}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--hair);font-size:14px;}
  .row:first-of-type{border-top:none;}
  .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .pill.ok{background:rgba(139,187,158,0.18);color:var(--sage);}
  .pill.warning,.pill.urgent{background:rgba(227,168,87,0.2);color:var(--amber);}
  .pill.overdue,.pill.missed,.pill.conflict{background:rgba(193,120,98,0.22);color:var(--rust);}

  .log{margin-top:36px;}
  .log ul{list-style:none;margin:0;padding:0;}
  .log li{
    display:grid;grid-template-columns:120px 1fr;gap:14px;padding:10px 0;
    border-top:1px solid var(--hair);font-size:13.5px;
  }
  .log li:first-child{border-top:none;}
  .log .t{color:var(--text-dim);font-variant-numeric:tabular-nums;}
  .log .a{color:var(--amber);font-weight:600;margin-right:6px;}

  footer{margin-top:48px;color:var(--text-dim);font-size:12.5px;}

  @media (max-width:720px){
    .strip,.panels{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <svg class="mark" viewBox="0 0 40 40" fill="none">
      <circle cx="16" cy="20" r="10" stroke="#e3a857" stroke-width="2.5"/>
      <circle cx="26" cy="16" r="10" stroke="#8bbb9e" stroke-width="2.5"/>
    </svg>
    <div>
      <h1>Kinloop</h1>
      <p class="tagline">Today's loop for Eleanor's care circle</p>
    </div>
  </header>

  <section class="strip" id="stats"></section>

  <section class="decision-banner">
    <h2>Needs you</h2>
    <div id="decisions"></div>
  </section>

  <h3 class="section-title">Behind the scenes today</h3>
  <div class="panels">
    <div class="panel">
      <h4>Medications</h4>
      <div id="meds"></div>
    </div>
    <div class="panel">
      <h4>Appointments</h4>
      <div id="appts"></div>
    </div>
    <div class="panel">
      <h4>Paperwork</h4>
      <div id="deadlines"></div>
    </div>
  </div>

  <div class="log">
    <h3 class="section-title">Activity log</h3>
    <ul id="activity"></ul>
  </div>

  <footer>
    Kinloop runs once a day, unattended. This dashboard is read-only — it reflects the last run's
    findings from <code>sample_data/</code> (or, in a live deployment, DynamoDB).
  </footer>
</div>

<script>
// Falls back to embedded sample data so this page renders meaningfully even
// opened directly as a file (no server, no fetch). In a real deployment this
// would fetch from an API Gateway endpoint backed by the same DynamoDB
// tables the Lambda writes to.
const FALLBACK = {
  meds: [
    {name:"Metformin 500mg", person:"Eleanor Whitfield", days_supply_remaining:3, status:"warning"},
    {name:"Lisinopril 10mg", person:"Eleanor Whitfield", days_supply_remaining:21, status:"ok"},
    {name:"Atorvastatin 20mg", person:"Eleanor Whitfield", days_supply_remaining:0, status:"overdue"}
  ],
  conflicts: [
    {type:"double_booked_driver", driver:"Sarah Whitfield", appointment_a:"Cardiology follow-up (Dr. Osei)", appointment_b:"Physical therapy", start:"2026-08-25T09:00:00"},
    {type:"no_driver_assigned", appointment:"Podiatry check-up", start:"2026-08-27T14:00:00"}
  ],
  deadlines: [
    {name:"Medicaid recertification", due_date:"2026-09-05", days_remaining:14, status:"urgent", missing_fields:["proof of income","signature"]},
    {name:"Medicare Part D plan confirmation", due_date:"2026-12-07", days_remaining:107, status:"ok", missing_fields:[]}
  ],
  decisions: [
    {message:"Sarah is double-booked Aug 25, 9–10am (cardiology + PT). Marcus is free that morning — okay to reassign PT to him?", recipient:"Sarah Whitfield"},
    {message:"Atorvastatin is out of refills and the podiatry appointment on Aug 27 has no driver assigned yet.", recipient:"family"}
  ],
  activity: [
    {timestamp:"2026-08-22T07:00:04Z", agent:"MedAgent", summary:"Checked 3 medications. Atorvastatin overdue, refill request drafted. Metformin running low (3 days) — noted, not yet urgent."},
    {timestamp:"2026-08-22T07:00:11Z", agent:"ApptAgent", summary:"Found 1 double-booked driver and 1 appointment missing a driver. Proposed Marcus for PT."},
    {timestamp:"2026-08-22T07:00:15Z", agent:"PaperworkAgent", summary:"Medicaid recertification due in 14 days, still missing proof of income and signature — flagged urgent."},
    {timestamp:"2026-08-22T07:00:22Z", agent:"NotifierAgent", summary:"Escalated 2 items requiring a family decision. Everything else was routine and logged only."}
  ]
};

function pill(status){ return `<span class="pill ${status}">${status}</span>`; }
function fmtTime(iso){
  try{ const d = new Date(iso); return d.toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}); }
  catch(e){ return iso; }
}

function render(data){
  const escalated = data.decisions.length;
  const meds = data.meds.length, appts = data.conflicts.length, deadlines = data.deadlines.length;
  const reviewed = meds + appts + deadlines;
  const resolved = reviewed - escalated;

  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="n">${reviewed}</div><div class="l">Items reviewed</div></div>
    <div class="stat sage"><div class="n">${Math.max(resolved,0)}</div><div class="l">Handled automatically</div></div>
    <div class="stat amber"><div class="n">${escalated}</div><div class="l">Need your decision</div></div>
  `;

  document.getElementById("decisions").innerHTML = data.decisions.length
    ? data.decisions.map(d => `
        <div class="decision-item">
          <div>
            <div class="msg">${d.message}</div>
            <div class="who">for ${d.recipient}</div>
          </div>
          <button class="btn">Respond</button>
        </div>`).join("")
    : `<p class="empty-decisions">Nothing needs you today — everything was routine.</p>`;

  document.getElementById("meds").innerHTML = data.meds.map(m => `
    <div class="row"><span>${m.name}</span>${pill(m.status)}</div>
  `).join("");

  document.getElementById("appts").innerHTML = data.conflicts.length
    ? data.conflicts.map(c => `
        <div class="row"><span>${c.appointment_a || c.appointment}${c.appointment_b ? " / " + c.appointment_b : ""}</span>${pill("conflict")}</div>
      `).join("")
    : `<div class="row"><span>No conflicts</span>${pill("ok")}</div>`;

  document.getElementById("deadlines").innerHTML = data.deadlines.map(d => `
    <div class="row"><span>${d.name}</span>${pill(d.status)}</div>
  `).join("");

  document.getElementById("activity").innerHTML = data.activity.map(a => `
    <li><span class="t">${fmtTime(a.timestamp)}</span><span><span class="a">${a.agent}</span>${a.summary}</span></li>
  `).join("");
}

render(FALLBACK);
</script>
</body>
</html>
